name: Poller CI

on:
  push:
    branches: [main]
    paths:
      - cmd/poller/**
      - cmd/flux/**
      - .github/workflows/poller.yml
      - Makefile
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile
  pull_request:
    paths:
      - cmd/poller/**
      - cmd/flux/**
      - .github/workflows/poller.yml
      - Makefile
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./...

      - name: Build Linux CLI archives
        run: make build-cli-linux

      - name: Upload Linux CLI archives
        uses: actions/upload-artifact@v7
        with:
          name: flux-linux-${{ github.sha }}
          path: bin/flux-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Extract short SHA and lowercase owner
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/flux-poller:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/flux-poller:sha-${{ steps.meta.outputs.sha }}
